<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué especialidad va conmigo? · CTN</title>
<meta name="description" content="Una guía de 12 preguntas para conocer qué especialidades del Colegio Técnico Nacional se parecen más a tus intereses.">
<meta name="theme-color" content="#471c0c">
<link rel="icon" href="../../assets/images/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/images/favicon-192.png">
<style>
/* ==========================================================================
   CTN · "¿Qué especialidad va conmigo?"  (guía de intereses)
   --------------------------------------------------------------------------
   Archivo único: estilos, preguntas y lógica. Para cambiar una pregunta,
   edita el bloque PREGUNTAS más abajo (en el <script>). La cantidad de
   preguntas que se muestra en pantalla se calcula sola.
   ========================================================================== */
@font-face { font-family: 'Dosis'; font-weight: 400; font-display: swap; src: url(../../assets/fonts/google/dosis-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Dosis'; font-weight: 500; font-display: swap; src: url(../../assets/fonts/google/dosis-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Dosis'; font-weight: 700; font-display: swap; src: url(../../assets/fonts/google/dosis-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 400; font-display: swap; src: url(../../assets/fonts/google/source-sans-3-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 600; font-display: swap; src: url(../../assets/fonts/google/source-sans-3-latin-600-normal.woff2) format('woff2'); }

html { scrollbar-gutter: stable; }   /* igual que el sitio: así el encabezado queda en el mismo lugar */
:root {
  --marron: #471c0c;
  --marron-oscuro: #2e1207;
  --dorado: #ffd380;
  --dorado-suave: #fff3d9;
  --crema: #fbf6ee;
  --texto: #2b211c;
  --texto-suave: #5c4f48;
  --borde: #e8dccb;
  --titulos: 'Dosis', 'Segoe UI', sans-serif;
  --cuerpo: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --sombra: 0 10px 28px rgba(46, 18, 7, .12);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: var(--cuerpo); font-size: 1.0625rem; line-height: 1.5; color: var(--texto); background: var(--crema); }
::selection { background: var(--dorado); color: var(--marron); }
:focus-visible { outline: 3px solid var(--marron); outline-offset: 3px; }
.solo-lectores { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---- Barra superior: mismas medidas que el menú del sitio (ctn.css) ----
   74,4 px de alto en escritorio y 72 px en pantallas chicas, fondo marrón,
   logo de 400 px (en pantallas chicas, el ancho de la pantalla menos 100 px)
   y enlace en Dosis 400 mayúscula como el menú.
   La línea de progreso va encima del borde de abajo, sin sumar alto. */
.barra {
  position: sticky; top: 0; z-index: 5;
  background: var(--marron); color: #fff;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .28);
}
.barra-interior {
  max-width: 1320px; min-height: 72px; margin: 0 auto; padding: 0 .175rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.barra-marca { display: block; padding: 10px 0; min-width: 0; }
.logo-container { position: relative; display: block; }
.logo-container img { display: block; width: min(400px, calc(100vw - 100px)); height: auto; transition: opacity .4s ease; }
.logo-container .logo-hovered { position: absolute; top: 0; left: 0; opacity: 0; }
.barra-marca:hover .logo-hovered, .barra-marca:focus-visible .logo-hovered { opacity: 1; }
.barra-marca:hover .logo-base, .barra-marca:focus-visible .logo-base { opacity: 0; }
.barra-marca:focus-visible { outline: 2px solid var(--dorado); outline-offset: 2px; }
.volver {
  display: inline-flex; align-items: center; gap: .3rem; padding: 1.5rem .85rem; white-space: nowrap;
  font-family: var(--titulos); font-size: 1rem; font-weight: 400; line-height: 1.65; letter-spacing: 1px; text-transform: uppercase;
  color: #fff; text-decoration: none; transition: color .25s ease;
}
.volver:hover, .volver:focus-visible { color: var(--dorado); }
.volver:focus-visible { outline: 2px solid var(--dorado); outline-offset: -6px; }
.volver svg { width: 18px; height: 18px; flex: none; }
.volver .largo { display: none; }
@media (min-width: 576px) { .volver .largo { display: inline; } .volver .corto { display: none; } }
@media (max-width: 991.98px) { .barra-interior { min-height: 72px; padding: 0 12px; } }
/* Por debajo de 992 px, igual que el sitio (que ahí muestra el botón del
   menú): a la derecha un botón cuadrado con borde dorado del mismo tamaño
   (53 × 45 px), con la flecha para volver. */
@media (max-width: 991.98px) {
  .volver { justify-content: center; width: 53px; height: 45px; padding: 0; border: 2px solid var(--dorado); border-radius: .375rem; }
  .volver .corto, .volver .largo { display: none; }
  .volver svg { width: 24px; height: 24px; }
  .volver:focus-visible { outline-offset: 2px; }
}
.barra-progreso { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .1); }
.barra-progreso i { display: block; height: 100%; width: 0; background: var(--dorado); transition: width .35s cubic-bezier(.2,.7,.2,1); }

main { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }
#app:focus, h1:focus, h2:focus { outline: none; }

/* ---- Botones ---- */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 48px; padding: .75rem 1.5rem; font: inherit; font-weight: 600; text-decoration: none;
  color: #fff; background: var(--marron); border: 2px solid var(--marron); border-radius: 999px; cursor: pointer;
  transition: background-color .2s ease, color .2s ease, transform .15s ease;
}
.boton:hover { background: var(--marron-oscuro); border-color: var(--marron-oscuro); }
.boton:active { transform: scale(.98); }
.boton svg { width: 20px; height: 20px; }
.boton-grande { min-height: 56px; padding: .9rem 2rem; font-size: 1.15rem; }
.boton-claro { color: var(--marron); background: #fff; }
.boton-claro:hover { color: #fff; background: var(--marron); }
.boton-texto { min-height: 44px; padding: .5rem .75rem; color: var(--marron); background: transparent; border-color: transparent; }
.boton-texto:hover { background: rgba(71, 28, 12, .06); border-color: transparent; }
.boton-texto[disabled] { visibility: hidden; }

/* ======================================================================
   PANTALLA 1 · INICIO
   ====================================================================== */
.inicio { display: grid; gap: 40px; align-items: center; }
@media (min-width: 820px) { .inicio { grid-template-columns: 1.05fr 1fr; gap: 56px; } }
.inicio h1 { margin: 0 0 14px; font-family: var(--titulos); font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; color: var(--marron); text-wrap: balance; }
.inicio .bajada { margin: 0 0 22px; font-size: 1.15rem; color: var(--texto-suave); max-width: 46ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; padding: 0; list-style: none; }
.chips li { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .85rem; border-radius: 999px; background: #fff; border: 1px solid var(--borde); font-weight: 600; font-size: .95rem; color: var(--marron); }
.chips svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nota { display: flex; gap: .6rem; margin: 24px 0 0; font-size: .92rem; color: var(--texto-suave); max-width: 52ch; }
.nota svg { flex: none; width: 20px; height: 20px; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

.especialidades { padding: 24px; background: #fff; border: 1px solid var(--borde); border-radius: 20px; box-shadow: var(--sombra); }
.especialidades p { margin: 0 0 16px; font-family: var(--titulos); font-weight: 700; font-size: 1.05rem; color: var(--marron); text-align: center; }
.inicio > * { min-width: 0; }

/* Foto de los tajy del colegio con un velo marrón (como las portadas del sitio).
   Es una sola capa (.foto) detrás de todas las pantallas: en el inicio ocupa
   toda la portada y al empezar se encoge hasta quedar como una franja de 136 px
   arriba, donde van el contador y el progreso. Así la foto acompaña todo el
   recorrido en lugar de desaparecer de golpe. */
.escenario { position: relative; }
.foto {
  position: absolute; top: 0; left: 0; right: 0; z-index: 0; height: 136px; overflow: hidden;
  background: var(--marron-oscuro) url(Img/tajy-1920.webp) center 35% / cover no-repeat;
  transition: height .6s cubic-bezier(.65, 0, .35, 1);
}
@media (max-width: 960px) { .foto { background-image: url(Img/tajy-960.webp); } }
.foto::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(46, 18, 7, .9) 0%, rgba(46, 18, 7, .78) 50%, rgba(46, 18, 7, .5) 100%);
}
@media (max-width: 819.98px) { .foto::before { background: rgba(46, 18, 7, .8); } }
main { position: relative; z-index: 1; }
body.en-portada main { max-width: none; padding: 0; }
.portada {
  position: relative; display: flex; align-items: center;
  min-height: calc(100dvh - 74px); padding: 56px 16px 64px; color: #fff;
}
.portada .inicio { position: relative; z-index: 1; width: 100%; max-width: 960px; margin: 0 auto; }
.portada :focus-visible { outline-color: var(--dorado); }
.portada h1 { color: #fff; }
.portada .bajada { color: #f3e7da; }
.portada .chips li { color: #fff; background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); }
.portada .chips svg { color: var(--dorado); }
.portada .nota { color: #e9dccd; }
.portada .boton { color: var(--marron); background: var(--dorado); border-color: var(--dorado); }
.portada .boton:hover { background: #fff; border-color: #fff; }
.portada .especialidades { box-shadow: 0 18px 40px rgba(0, 0, 0, .35); border-color: transparent; }
.logos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; margin: 0; padding: 0; list-style: none; }
.logos li { display: grid; justify-items: center; gap: 6px; min-width: 0; text-align: center; font-size: .8rem; line-height: 1.2; color: var(--texto-suave); }
/* En el teléfono: 2 columnas con el logo al lado del nombre, así los nombres
   largos («Construcciones Civiles», «Electromecánica») no se cortan. */
@media (max-width: 480px) {
  .especialidades { padding: 18px 16px; }
  .logos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .logos li { grid-template-columns: 44px 1fr; justify-items: start; align-items: center; gap: 10px; text-align: left; font-size: .9rem; }
  .logos img { max-width: 44px; }
}
.logos img { width: 100%; max-width: 76px; height: auto; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 1px var(--borde); }

/* ======================================================================
   PANTALLA 2 · PREGUNTA
   ====================================================================== */
.pregunta { max-width: 820px; margin: 0 auto; }
.pregunta-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 18px; }
.contador { font-family: var(--titulos); font-weight: 700; font-size: 1rem; letter-spacing: .02em; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.contador b { color: var(--marron); font-size: 1.35rem; }
.pasos { display: grid; grid-auto-flow: column; gap: 4px; margin: 0 0 28px; padding: 0; list-style: none; }
.pasos li { height: 6px; border-radius: 999px; background: var(--borde); transition: background-color .3s ease; }
.pasos li.hecho { background: var(--marron); }
.pasos li.actual { background: var(--dorado); }

/* Sobre la franja de foto: contador, «Anterior» y progreso en claro */
.pregunta-cabecera .contador { color: #e9dccd; }
.pregunta-cabecera .contador b { color: #fff; }
.pregunta-cabecera .boton-texto { color: #fff; }
.pregunta-cabecera .boton-texto:hover { background: rgba(255, 255, 255, .12); }
.pregunta-cabecera :focus-visible, .pasos + * :focus-visible { outline-color: var(--dorado); }
.pasos li { background: rgba(255, 255, 255, .28); }
.pasos li.hecho { background: var(--dorado); }
.pasos li.actual { background: #fff; }
/* Lo que va sobre la foto vive entero dentro de la franja (136 px), centrado
   en vertical; lo de abajo empieza siempre a la misma distancia del borde. */
body:not(.en-portada) main { padding-top: 0; }
.franja-contenido { display: flex; flex-direction: column; justify-content: center; gap: 14px; height: 136px; margin-bottom: 40px; }
.franja-contenido .pregunta-cabecera { margin: 0; }
.franja-contenido .pasos { margin: 0; }
.pregunta h2 { margin: 0 0 8px; font-family: var(--titulos); font-size: clamp(1.5rem, 4.5vw, 2.1rem); line-height: 1.15; color: var(--marron); text-wrap: balance; }
.ayuda { margin: 0 0 24px; color: var(--texto-suave); }
.opciones { display: grid; gap: 12px; }
@media (min-width: 720px) { .opciones { grid-template-columns: 1fr 1fr; gap: 14px; } }
.opcion {
  position: relative; display: flex; align-items: flex-start; gap: 14px; width: 100%; min-height: 96px; padding: 18px;
  font: inherit; font-size: 1.05rem; line-height: 1.4; text-align: left; color: var(--texto);
  background: #fff; border: 2px solid var(--borde); border-radius: 16px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(46, 18, 7, .05);
  transition: border-color .2s ease, background-color .2s ease, transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s ease;
}
.opcion:hover { border-color: var(--marron); transform: translateY(-2px); box-shadow: var(--sombra); }
.letra {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
  font-family: var(--titulos); font-weight: 700; color: var(--marron); background: var(--dorado-suave); border: 1px solid #f1d9a6;
  transition: background-color .2s ease, color .2s ease;
}
.opcion .marca { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--marron); color: var(--dorado); opacity: 0; transform: scale(.6); transition: opacity .2s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
.opcion .marca svg { width: 16px; height: 16px; }
.opcion[aria-pressed="true"] { border-color: var(--marron); background: var(--dorado-suave); }
.opcion[aria-pressed="true"] .letra { background: var(--marron); color: var(--dorado); border-color: var(--marron); }
.opcion[aria-pressed="true"] .marca { opacity: 1; transform: none; }
.teclas { margin: 18px 0 0; font-size: .9rem; color: var(--texto-suave); text-align: center; }
.teclas kbd { display: inline-block; min-width: 1.6em; padding: 0 .35em; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 5px; background: #fff; font: 600 .85em var(--cuerpo); color: var(--marron); }
@media (hover: none) { .teclas { display: none; } }
.entra { animation: entra .35s cubic-bezier(.2,.7,.2,1) both; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ======================================================================
   PANTALLA 3 · RESULTADOS
   ====================================================================== */
.resultados { max-width: 860px; margin: 0 auto; }
.resultados h1 { margin: 0; font-family: var(--titulos); font-size: clamp(1.6rem, 4.5vw, 2.1rem); line-height: 1.1; color: #fff; text-align: center; }
.ganadora {
  display: grid; gap: 24px; align-items: center; padding: 28px;
  background: var(--marron); color: #fff; border-radius: 24px; box-shadow: var(--sombra);
}
@media (min-width: 680px) { .ganadora { grid-template-columns: 168px 1fr; padding: 36px; gap: 32px; } }
.ganadora img { width: 140px; height: 140px; justify-self: center; border-radius: 50%; border: 4px solid var(--dorado); background: #fff; }
@media (min-width: 680px) { .ganadora img { width: 168px; height: 168px; } }
.ganadora .etiqueta { margin: 0; font-weight: 600; color: var(--dorado); }
.ganadora h2 { margin: 2px 0 8px; font-family: var(--titulos); font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.05; color: #fff; }
.ganadora p { margin: 0 0 18px; color: #f3e7da; font-size: 1.08rem; }
.ganadora .boton { color: var(--marron); background: var(--dorado); border-color: var(--dorado); }
.ganadora .boton:hover { background: #fff; border-color: #fff; }
.coincide { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 14px; font-size: .95rem; color: #f3e7da; }
.coincide b { font-family: var(--titulos); font-size: 1.25rem; color: var(--dorado); }

.tambien { margin: 32px 0 0; }
.tambien h3, .todas h3 { margin: 0 0 14px; font-family: var(--titulos); font-size: 1.3rem; color: var(--marron); }
.tambien-lista { display: grid; gap: 14px; }
@media (min-width: 680px) { .tambien-lista { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
.mini {
  display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 16px;
  background: #fff; border: 1px solid var(--borde); border-radius: 16px; text-decoration: none; color: inherit;
  transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.mini:hover { border-color: var(--marron); transform: translateY(-2px); box-shadow: var(--sombra); }
.mini img { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 1px var(--borde); }
.mini strong { display: block; font-family: var(--titulos); font-size: 1.2rem; color: var(--marron); }
.mini span { font-size: .95rem; color: var(--texto-suave); }

.todas { margin: 36px 0 0; padding: 24px; background: #fff; border: 1px solid var(--borde); border-radius: 20px; }
.todas p.explica { margin: -6px 0 16px; font-size: .95rem; color: var(--texto-suave); }
.barras { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.barras li { display: grid; grid-template-columns: minmax(8.5rem, 11rem) 1fr 2.2rem; gap: 12px; align-items: center; font-size: .97rem; }
.barras .pista { height: 12px; border-radius: 999px; background: var(--crema); overflow: hidden; }
.barras .pista i { display: block; height: 100%; border-radius: inherit; background: #c9b59b; transform-origin: left; animation: crece .7s cubic-bezier(.2,.7,.2,1) both; }
.barras li.top .pista i { background: var(--marron); }
.barras li.top { font-weight: 600; color: var(--marron); }
.barras .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--texto-suave); }
@keyframes crece { from { transform: scaleX(0); } to { transform: none; } }
@media (max-width: 480px) { .barras li { grid-template-columns: 1fr 2rem; } .barras .pista { grid-column: 1 / -1; grid-row: 2; } }

.cierre { margin: 28px 0 0; text-align: center; }
.cierre .nota { justify-content: center; margin: 0 auto 20px; text-align: left; }
.acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="barra">
  <div class="barra-interior">
    <a class="barra-marca" href="../../index.html" aria-label="Colegio Técnico Nacional - Inicio">
      <span class="logo-container">
        <img src="../../assets/images/themelogo/logo3.png" class="logo-base" alt="" width="567" height="68">
        <img src="../../assets/images/themelogo/logo.png" class="logo-hovered" alt="" width="567" height="68">
      </span>
    </a>
    <a class="volver" href="../../espe.html" aria-label="Volver a Especialidades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span class="corto">Volver</span><span class="largo">Volver a Especialidades</span>
    </a>
  </div>
  <div class="barra-progreso" aria-hidden="true"><i></i></div>
</header>

<div class="escenario">
  <div class="foto" aria-hidden="true"></div>
  <main>
    <div id="app" tabindex="-1"></div>
  </main>
</div>

<noscript><p style="text-align:center">Esta guía necesita JavaScript para funcionar.</p></noscript>

<script>
(function () {
  'use strict';

  /* ======================================================================
     ESPECIALIDADES
     id = el mismo que usa espe.html (espe.html#id abre esa especialidad)
     ====================================================================== */
  var ESPECIALIDADES = {
    info:            { nombre: 'Informática',            logo: 'info_c.jpg', texto: 'Programación, bases de datos, redes y ciberseguridad.' },
    mecanica_ind:    { nombre: 'Mecánica Industrial',    logo: 'indu_c.png', texto: 'Fabricación y reparación de piezas, uso de tornos y fresadoras, precisión mecánica.' },
    mecanica_auto:   { nombre: 'Mecánica Automotriz',    logo: 'auto_c.png', texto: 'Diagnóstico y reparación de vehículos, motores y sistemas automotrices.' },
    construccion:    { nombre: 'Construcciones Civiles', logo: 'cc_c.png',   texto: 'Planos, cálculo de estructuras y supervisión de obras.' },
    electronica:     { nombre: 'Electrónica',            logo: 'eik_c.png',  texto: 'Montaje y reparación de placas, microcontroladores y dispositivos electrónicos.' },
    electromecanica: { nombre: 'Electromecánica',        logo: 'emca_c.png', texto: 'Mantenimiento y automatización de máquinas que combinan electricidad y mecánica.' },

  var AVISO = 'Esta guía no es un test psicológico ni vocacional profesional. Es una ayuda para conocer las especialidades del CTN según tus intereses.';
  var LETRAS = ['A', 'B', 'C', 'D'];
  var reducir = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var app = document.getElementById('app');
  var relleno = document.querySelector('.barra-progreso i');
  var actual = 0;
  var respuestas = new Array(PREGUNTAS.length);
  var bloqueado = false;
  var enPregunta = false;

  function crear(etiqueta, clase, texto) {
    var el = document.createElement(etiqueta);
    if (clase) { el.className = clase; }
    if (texto !== undefined) { el.textContent = texto; }
    return el;
  }
  function icono(d, extra) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ' + (extra || '') + '>' + d + '</svg>';
  }
  /* En la portada la foto ocupa todo su alto; en las demás pantallas vuelve a
     la franja de 136 px del CSS (y la transición la encoge suavemente). */
  var foto = document.querySelector('.foto');
  var primeraVez = true;
  function ajustarFoto(sinAnimar) {
    var portada = app.querySelector('.portada');
    if (primeraVez || sinAnimar === true) { foto.style.transition = 'none'; }
    foto.style.height = portada ? portada.offsetHeight + 'px' : '';
    if (primeraVez || sinAnimar === true) { void foto.offsetHeight; foto.style.transition = ''; }
    primeraVez = false;
  }
  window.addEventListener('resize', function () { ajustarFoto(true); });

  function mostrar(nodo, foco) {
    document.body.classList.toggle('en-portada', nodo.classList.contains('portada'));
    app.textContent = '';
    app.appendChild(nodo);
    ajustarFoto();
    window.scrollTo(0, 0);
    (foco || app).focus({ preventScroll: true });
  }
  function progreso(valor) { relleno.style.width = (valor * 100) + '%'; }

  var I_PREGUNTAS = '<rect x="5" y="3.5" width="14" height="17.5" rx="2"/><path d="M9 3.5h6v2.5H9zM8.5 11h7M8.5 14.5h7M8.5 18h4"/>';
  var I_RELOJ = '<circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9.5 2.5h5"/>';
  var I_RAYO = '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>';
  var I_INFO = '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/>';
  var I_FLECHA = '<path d="M5 12h14M13 6l6 6-6 6"/>';
  var I_CHECK = '<path d="m5 12.5 4.5 4.5L19 7.5"/>';
  var I_VOLVER = '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>';

  /* ---------- Pantalla 1: inicio ---------- */
  function pantallaInicio() {
    enPregunta = false;
    progreso(0);
    var portada = crear('section', 'portada');
    var cont = crear('div', 'inicio entra');
    portada.appendChild(cont);
    var izq = crear('div');
    var h1 = crear('h1', '', '¿Qué especialidad va con vos?');
    h1.tabIndex = -1;
    izq.appendChild(h1);
    izq.appendChild(crear('p', 'bajada', 'Respondé ' + PREGUNTAS.length + ' preguntas sobre lo que te gusta hacer y te mostramos qué especialidades del CTN se parecen más a vos. No hay respuestas buenas ni malas.'));
    var chips = crear('ul', 'chips');
    [[I_PREGUNTAS, PREGUNTAS.length + ' preguntas'], [I_RELOJ, '3 minutos'], [I_RAYO, 'Resultado al instante']].forEach(function (c) {
      var li = crear('li'); li.innerHTML = icono(c[0]); li.appendChild(document.createTextNode(c[1])); chips.appendChild(li);
    });
    izq.appendChild(chips);
    var empezar = crear('button', 'boton boton-grande');
    empezar.type = 'button';
    empezar.appendChild(document.createTextNode('Empezar'));
    empezar.insertAdjacentHTML('beforeend', icono(I_FLECHA));
    empezar.addEventListener('click', function () { actual = 0; pantallaPregunta(); });
    izq.appendChild(empezar);
    var nota = crear('p', 'nota'); nota.innerHTML = icono(I_INFO); nota.appendChild(document.createTextNode(AVISO));
    izq.appendChild(nota);

    var der = crear('div', 'especialidades');
    der.appendChild(crear('p', '', 'Vas a descubrir cuál de estas 8 va con vos'));
    var logos = crear('ul', 'logos');
    Object.keys(ESPECIALIDADES).forEach(function (id) {
      var e = ESPECIALIDADES[id];
      var li = crear('li');
      var img = crear('img'); img.src = './Img/' + e.logo; img.alt = ''; img.width = 76; img.height = 76; img.loading = 'lazy';
      li.appendChild(img); li.appendChild(document.createTextNode(e.nombre));
      logos.appendChild(li);
    });
    der.appendChild(logos);
    cont.appendChild(izq); cont.appendChild(der);
    mostrar(portada, h1);
  }

  /* ---------- Pantalla 2: pregunta ---------- */
  function pantallaPregunta() {
    bloqueado = false; enPregunta = true;
    var p = PREGUNTAS[actual];
    progreso(actual / PREGUNTAS.length);
    var cont = crear('section', 'pregunta');
    cont.appendChild(crear('h1', 'solo-lectores', '¿Qué especialidad va con vos?'));

    var cab = crear('div', 'pregunta-cabecera');
    var cont_txt = crear('p', 'contador');
    cont_txt.style.margin = '0';
    cont_txt.innerHTML = 'Pregunta <b>' + (actual + 1) + '</b> de ' + PREGUNTAS.length;
    var atras = crear('button', 'boton boton-texto');
    atras.type = 'button';
    atras.insertAdjacentHTML('beforeend', icono('<path d="m15 18-6-6 6-6"/>'));
    atras.appendChild(document.createTextNode('Anterior'));
    atras.disabled = actual === 0;
    atras.addEventListener('click', function () { if (!bloqueado && actual > 0) { actual--; pantallaPregunta(); } });
    cab.appendChild(cont_txt); cab.appendChild(atras);
    var franja = crear('div', 'franja-contenido');
    franja.appendChild(cab);

    var pasos = crear('ol', 'pasos');
    pasos.setAttribute('aria-hidden', 'true');
    pasos.style.gridTemplateColumns = 'repeat(' + PREGUNTAS.length + ', 1fr)';
    PREGUNTAS.forEach(function (_, i) { pasos.appendChild(crear('li', i < actual ? 'hecho' : i === actual ? 'actual' : '')); });
    franja.appendChild(pasos);
    cont.appendChild(franja);

    var cuerpo = crear('div', reducir ? '' : 'entra');
    var h2 = crear('h2', '', p.texto); h2.tabIndex = -1; h2.id = 'pregunta-titulo';
    cuerpo.appendChild(h2);
    cuerpo.appendChild(crear('p', 'ayuda', 'Elegí la opción que más se parezca a vos.'));
    var opciones = crear('div', 'opciones');
    opciones.setAttribute('role', 'group');
    opciones.setAttribute('aria-labelledby', 'pregunta-titulo');
    p.opciones.forEach(function (op, i) {
      var b = crear('button', 'opcion');
      b.type = 'button';
      b.setAttribute('aria-pressed', respuestas[actual] === i ? 'true' : 'false');
      b.appendChild(crear('span', 'letra', LETRAS[i]));
      b.appendChild(crear('span', '', op.texto));
      var marca = crear('span', 'marca'); marca.innerHTML = icono(I_CHECK, 'stroke-width="3"'); b.appendChild(marca);
      b.addEventListener('click', function () { elegir(i); });
      opciones.appendChild(b);
    });
    cuerpo.appendChild(opciones);
    var teclas = crear('p', 'teclas');
    teclas.innerHTML = 'También podés responder con las teclas <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd>';
    cuerpo.appendChild(teclas);
    cont.appendChild(cuerpo);
    mostrar(cont, h2);
  }

  function elegir(i) {
    if (bloqueado) { return; }
    bloqueado = true;
    respuestas[actual] = i;
    app.querySelectorAll('.opcion').forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === i)); });
    progreso((actual + 1) / PREGUNTAS.length);
    setTimeout(function () {
      if (actual < PREGUNTAS.length - 1) { actual++; pantallaPregunta(); } else { pantallaResultados(); }
    }, reducir ? 120 : 380);
  }

  document.addEventListener('keydown', function (e) {
    if (!enPregunta || e.altKey || e.ctrlKey || e.metaKey) { return; }
    var k = e.key.toUpperCase();
    var i = LETRAS.indexOf(k);
    if (i === -1 && /^[1-4]$/.test(k)) { i = +k - 1; }
    if (i !== -1) { elegir(i); e.preventDefault(); }
  });

  /* ---------- Cálculo del resultado ---------- */
  function calcularPuntajes() {
    var puntos = {};
    Object.keys(ESPECIALIDADES).forEach(function (id) { puntos[id] = 0; });
    respuestas.forEach(function (eleccion, i) {
      PREGUNTAS[i].opciones[eleccion].suma.forEach(function (id) { puntos[id]++; });
    });
    return puntos;
  }
  function mejores(puntos) {
    var orden = Object.keys(puntos).sort(function (a, b) { return puntos[b] - puntos[a]; });
    var corte = puntos[orden[1]];
    return orden.filter(function (id, i) { return i < 2 || (i < 3 && puntos[id] === corte); });
  }

  /* ---------- Pantalla 3: resultados ---------- */
  function pantallaResultados() {
    enPregunta = false;
    progreso(1);
    var puntos = calcularPuntajes();
    var elegidas = mejores(puntos);
    var cont = crear('section', 'resultados entra');
    var h1 = crear('h1', '', 'Tu resultado'); h1.tabIndex = -1;
    var franjaR = crear('div', 'franja-contenido');
    franjaR.appendChild(h1);
    cont.appendChild(franjaR);

    var id0 = elegidas[0], e0 = ESPECIALIDADES[id0];
    var gan = crear('article', 'ganadora');
    var img = crear('img'); img.src = './Img/' + e0.logo; img.alt = ''; img.width = 168; img.height = 168;
    gan.appendChild(img);
    var info = crear('div');
    info.appendChild(crear('p', 'etiqueta', 'La especialidad que más coincide con vos'));
    info.appendChild(crear('h2', '', e0.nombre));
    var co = crear('p', 'coincide'); co.innerHTML = '<b>' + puntos[id0] + '</b> de tus ' + PREGUNTAS.length + ' respuestas apuntan acá';
    info.appendChild(co);
    info.appendChild(crear('p', '', e0.texto));
    var ver = crear('a', 'boton', 'Conocer ' + e0.nombre); ver.href = '../../espe.html#' + id0;
    ver.insertAdjacentHTML('beforeend', icono(I_FLECHA));
    info.appendChild(ver);
    gan.appendChild(info);
    cont.appendChild(gan);

    if (elegidas.length > 1) {
      var tam = crear('section', 'tambien');
      tam.appendChild(crear('h3', '', 'También te puede gustar'));
      var lista = crear('div', 'tambien-lista');
      elegidas.slice(1).forEach(function (id) {
        var e = ESPECIALIDADES[id];
        var a = crear('a', 'mini'); a.href = '../../espe.html#' + id;
        var im = crear('img'); im.src = './Img/' + e.logo; im.alt = ''; im.width = 64; im.height = 64;
        var t = crear('div'); t.appendChild(crear('strong', '', e.nombre)); t.appendChild(crear('span', '', e.texto));
        a.appendChild(im); a.appendChild(t); lista.appendChild(a);
      });
      tam.appendChild(lista);
      cont.appendChild(tam);
    }

    var todas = crear('section', 'todas');
    todas.appendChild(crear('h3', '', 'Cómo coincidiste con cada especialidad'));

    var max = Math.max.apply(null, Object.keys(puntos).map(function (k) { return puntos[k]; })) || 1;
    var barras = crear('ol', 'barras');
    Object.keys(puntos).sort(function (a, b) { return puntos[b] - puntos[a]; }).forEach(function (id, i) {
      var li = crear('li', elegidas.indexOf(id) !== -1 ? 'top' : '');
      li.appendChild(crear('span', '', ESPECIALIDADES[id].nombre));
      var pista = crear('span', 'pista'); var r = crear('i'); r.style.width = (puntos[id] / max * 100) + '%'; r.style.animationDelay = (i * 0.05) + 's';
      pista.appendChild(r); li.appendChild(pista);
      li.appendChild(crear('span', 'num', String(puntos[id])));
      li.setAttribute('aria-label', ESPECIALIDADES[id].nombre + ': ' + puntos[id] + ' puntos');
      barras.appendChild(li);
    });
    todas.appendChild(barras);
    cont.appendChild(todas);

    var cierre = crear('div', 'cierre');
    var nota = crear('p', 'nota'); nota.innerHTML = icono(I_INFO);
    nota.appendChild(document.createTextNode('Es una orientación, no una decisión. Visitá el colegio, hablá con los coordinadores y conocé los talleres antes de elegir.'));
    cierre.appendChild(nota);
    var acc = crear('div', 'acciones');
    var otra = crear('button', 'boton boton-claro'); otra.type = 'button';
    otra.insertAdjacentHTML('beforeend', icono(I_VOLVER)); otra.appendChild(document.createTextNode('Volver a intentar'));
    otra.addEventListener('click', function () { respuestas = new Array(PREGUNTAS.length); pantallaInicio(); });
    var todasA = crear('a', 'boton', 'Ver todas las especialidades'); todasA.href = '../../espe.html';
    acc.appendChild(otra); acc.appendChild(todasA);
    cierre.appendChild(acc);
    cont.appendChild(cierre);
    mostrar(cont, h1);
  }

  pantallaInicio();
})();
