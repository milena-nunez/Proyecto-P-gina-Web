<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué especialidad va conmigo? · CTN</title>
<meta name="description" content="Una guía de 10 preguntas para conocer qué especialidades del Colegio Técnico Nacional se parecen más a tus intereses.">
<link rel="icon" href="../../assets/images/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/images/favicon-192.png">
<style>
/* ==========================================================================
   CTN · "¿Qué especialidad va conmigo?"  (guía de intereses, 10 preguntas)
   --------------------------------------------------------------------------
   Archivo único: estilos, preguntas y lógica. Para cambiar una pregunta,
   edita el bloque PREGUNTAS más abajo (en el <script>).
   ========================================================================== */
@font-face { font-family: 'Dosis'; font-weight: 500; font-display: swap; src: url(../../assets/fonts/google/dosis-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Dosis'; font-weight: 700; font-display: swap; src: url(../../assets/fonts/google/dosis-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 400; font-display: swap; src: url(../../assets/fonts/google/source-sans-3-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 600; font-display: swap; src: url(../../assets/fonts/google/source-sans-3-latin-600-normal.woff2) format('woff2'); }

:root {
  --marron: #471c0c;
  --dorado: #ffd380;
  --crema: #fbf6ee;
  --texto: #2b211c;
  --borde: #e6d9c8;
  --titulos: 'Dosis', 'Segoe UI', sans-serif;
  --cuerpo: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px 16px;
  display: flex; justify-content: center; align-items: flex-start;
  font-family: var(--cuerpo); font-size: 1.0625rem; color: var(--texto);
  background: linear-gradient(rgba(46, 18, 7, .65), rgba(46, 18, 7, .65)), url('./Img/slide-3.jpg') center / cover fixed no-repeat;
}
.tarjeta {
  width: 100%; max-width: 820px; margin: 16px auto;
  background: var(--crema); border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); overflow: hidden;
}
/* Texto solo para lectores de pantalla (título de la página sin cabecera visible) */
.solo-lectores { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.cuerpo { padding: 28px 40px; }
.cuerpo:focus, h2:focus { outline: none; }

/* Progreso */
.progreso { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.progreso-barra { flex: 1; height: 10px; border-radius: 999px; background: var(--borde); overflow: hidden; }
.progreso-barra i { display: block; height: 100%; background: var(--marron); transition: width .25s ease; }
.progreso-texto { font-size: .9rem; font-weight: 600; white-space: nowrap; }

/* Pregunta y opciones */
h2 { margin: 0 0 18px; font-family: var(--titulos); font-size: clamp(1.3rem, 4.5vw, 1.6rem); line-height: 1.25; color: var(--marron); }
.opciones { display: grid; gap: 12px; }
.opcion {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 16px;
  font: inherit; text-align: left; color: var(--texto); background: #fff;
  border: 2px solid var(--borde); border-radius: 12px; cursor: pointer;
  transition: border-color .2s ease, background-color .2s ease, transform .15s ease;
}
.opcion:hover { border-color: var(--marron); background: #fff7e8; transform: translateY(-1px); }
.opcion:focus-visible, .boton:focus-visible { outline: 3px solid var(--marron); outline-offset: 2px; }
.opcion[aria-pressed="true"] { border-color: var(--dorado); background: var(--dorado); color: var(--marron); }
.opcion[aria-pressed="true"] .letra { background: var(--marron); color: var(--dorado); }

.letra {
  flex: none; width: 2rem; height: 2rem; display: grid; place-items: center;
  font-family: var(--titulos); font-weight: 700; color: var(--marron); background: var(--dorado); border-radius: 50%;
}

/* Botones */
.acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; }
.boton {
  display: inline-block; padding: 12px 22px; font: inherit; font-weight: 600; text-decoration: none; text-align: center;
  color: #fff; background: var(--marron); border: 2px solid var(--marron); border-radius: 999px; cursor: pointer;
  transition: background-color .2s ease, color .2s ease;
}
.boton:hover { background: #fff; color: var(--marron); }
.boton-claro { color: var(--marron); background: #fff; }
.boton-claro:hover { background: var(--marron); color: #fff; }
.boton[disabled] { opacity: .4; pointer-events: none; }

/* Pantalla de inicio y de resultados */
.centrado { text-align: center; }
/* Pantalla de inicio: título y texto a la izquierda, dos datos y el botón centrado */
.inicio-cabecera { display: flex; align-items: center; gap: 20px; }
.inicio-texto { flex: 1; min-width: 0; }
.inicio-logo { flex: none; width: 110px; height: auto; background: #fff; border: 3px solid var(--marron); border-radius: 50%; }
.inicio h2 { margin-bottom: 12px; font-size: clamp(1.3rem, 4.4vw, 1.6rem); }
.inicio p { margin: 0; }
.inicio .aviso { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.inicio .aviso svg { flex: none; width: 30px; height: 30px; fill: none; stroke: #7a5c2e; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.datos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.dato { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 12px; background: var(--marron); border: 2px solid var(--marron); border-radius: 12px; }
.dato svg { flex: none; width: 38px; height: 38px; fill: none; stroke: var(--dorado); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dato-texto { display: flex; align-items: baseline; gap: 8px; }
.dato strong { font-family: var(--titulos); font-size: 2.25rem; line-height: 1; color: var(--dorado); }
.dato span { font-size: .95rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--crema); }
@media (max-width: 480px) {
  .inicio-logo { width: 64px; }
  .inicio-cabecera { gap: 14px; }
  .dato { gap: 8px; padding: 12px 8px; }
  .dato svg { width: 30px; height: 30px; }
  .dato strong { font-size: 1.9rem; }
  .dato-texto { gap: 6px; }
  .dato span { font-size: .8rem; letter-spacing: .3px; }
}
.aviso { margin: 18px 0 0; padding: 12px 14px; font-size: .95rem; background: #fff; border-left: 4px solid var(--dorado); border-radius: 6px; text-align: left; }
.resultados { display: grid; gap: 16px; margin-top: 8px; }
.resultado { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 16px; background: #fff; border: 2px solid var(--borde); border-radius: 14px; animation: entra .5s ease both; }
.resultado:first-child { border-color: var(--dorado); }
.resultado img { width: 96px; height: 96px; border-radius: 50%; }
.resultado .puesto { margin: 0; font-size: .85rem; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: #7a5c2e; }
.resultado h3 { margin: 2px 0 6px; font-family: var(--titulos); font-size: 1.5rem; color: var(--marron); }
.resultado p { margin: 0 0 10px; }
.resultado .boton { padding: 8px 16px; font-size: .95rem; }
@keyframes entra { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@media (max-width: 480px) {
  .cuerpo { padding: 22px 24px; }
  .resultado { grid-template-columns: 1fr; text-align: center; justify-items: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<main class="tarjeta" aria-labelledby="titulo">
  <h1 class="solo-lectores" id="titulo">¿Qué especialidad va conmigo? · Colegio Técnico Nacional de Asunción</h1>
  <div class="cuerpo" id="app" tabindex="-1"></div>
</main>

<noscript><p style="color:#fff;text-align:center">Esta guía necesita JavaScript para funcionar.</p></noscript>

<script>
(function () {
  'use strict';

  /* ======================================================================
     ESPECIALIDADES
     id = el mismo que usa espe.html (espe.html#id abre esa especialidad)
     ====================================================================== */
  var ESPECIALIDADES = {
    info:            { nombre: 'Informática',            logo: 'info_c.jpg', texto: 'Programación, bases de datos, redes y ciberseguridad.' },
    mecanica_ind:    { nombre: 'Mecánica Industrial',    logo: 'indu_c.png', texto: 'Fabricación y reparación de piezas, uso de tornos y fresadoras, precisión mecánica.' },
    mecanica_auto:   { nombre: 'Mecánica Automotriz',    logo: 'auto_c.png', texto: 'Diagnóstico y reparación de vehículos, motores y sistemas automotrices.' },
    construccion:    { nombre: 'Construcciones Civiles', logo: 'cc_c.png',   texto: 'Planos, cálculo de estructuras y supervisión de obras.' },
    electronica:     { nombre: 'Electrónica',            logo: 'eik_c.png',  texto: 'Montaje y reparación de placas, microcontroladores y dispositivos electrónicos.' },
    electromecanica: { nombre: 'Electromecánica',        logo: 'emca_c.png', texto: 'Mantenimiento y automatización de máquinas que combinan electricidad y mecánica.' },
    electricidad:    { nombre: 'Electricidad',           logo: 'edad_c.png', texto: 'Instalaciones eléctricas, circuitos y distribución de energía.' },
    quimica:         { nombre: 'Química Industrial',     logo: 'qca_c.png',  texto: 'Procesos químicos, control de calidad y trabajo en laboratorio.' }
  };

  /* ======================================================================
     PREGUNTAS
     Cada opción suma 1 punto a cada especialidad de su lista "suma".
     ====================================================================== */
  var PREGUNTAS = [
    { texto: 'Cuando estás libre o haciendo un trabajo en grupo, ¿qué es lo que más te gusta hacer?', opciones: [
      { texto: 'Usar la computadora para crear páginas, programas o resolver juegos de lógica.', suma: ['info'] },
      { texto: 'Mirar motores, arreglar bicis, motos o entender cómo funcionan los autos.', suma: ['mecanica_auto'] },
      { texto: 'Dibujar planos, hacer maquetas de casas o imaginar cómo construir un edificio.', suma: ['construccion'] },
      { texto: 'Hacer experimentos divertidos, mezclar ingredientes o ver cómo se hacen los productos.', suma: ['quimica'] }
    ]},
    { texto: '¿Qué problema de la vida cotidiana te daría más gusto resolver?', opciones: [
      { texto: 'Que un juego, programa o aplicación de la compu no abra o tenga un error.', suma: ['info', 'electronica'] },
      { texto: 'Un foco quemado, un enchufe que no anda o un aparato que no prende en casa.', suma: ['electricidad', 'electromecanica'] },
      { texto: 'Un ruido raro en el motor de un vehículo o que no funcionen bien los frenos.', suma: ['mecanica_auto', 'electromecanica'] },
      { texto: 'Calcular las cantidades exactas de ingredientes para que una receta o mezcla salga perfecta.', suma: ['quimica'] }
    ]},
    { texto: 'Si pudieras ir de excursión hoy a conocer un lugar de trabajo, ¿a dónde irías?', opciones: [
      { texto: 'A un taller donde cortan, moldean y fabrican piezas de metal con máquinas grandes.', suma: ['mecanica_ind'] },
      { texto: 'A una obra grande de construcción para ver cómo levantan un edificio o un puente. ', suma: ['construccion'] },
      { texto: 'A un laboratorio moderno donde crean nuevos perfumes, remedios o jabones.', suma: ['quimica'] },
      { texto: 'A una empresa de tecnología donde crean videojuegos, aplicaciones o robots con inteligencia artificial.', suma: ['info'] }
    ]},
    { texto: '¿Cuáles de estas herramientas te llaman más la atención para aprender a usarlas bien?', opciones: [
      { texto: 'Soldadores de estaño, luces LED, sensores y plaquitas con chips.', suma: ['electronica'] },
      { texto: 'Cables, tableros de llaves de luz, medidores de corriente y transformadores.', suma: ['electricidad'] },
      { texto: 'Teclado de computadora, líneas de código, programas de programación y redes.', suma: ['info'] },
      { texto: 'Reglas especiales, niveles de agua, programas de dibujo en 3D y cinta métrica.', suma: ['construccion'] }
    ]},
    { texto: '¿Qué tema de la escuela o de la ciencia te llama más la atención?', opciones: [
      { texto: 'La física del movimiento, palancas, fuerza y engranajes mecánicos.', suma: ['mecanica_ind', 'electromecanica'] },
      { texto: 'La química de la materia, reacciones, soluciones y tabla periódica.', suma: ['quimica'] },
      { texto: 'La lógica matemática, algoritmos, sistemas binarios y álgebra.', suma: ['info'] },
      { texto: 'La geometría, el cálculo de áreas, volúmenes y la trigonometría aplicada al espacio.', suma: ['construccion'] }
    ]},
    { texto: 'Si pudieras elegir un trabajo del futuro, ¿cuál preferirías?', opciones: [
      { texto: 'Diseñar y fabricar repuestos y partes de metal para aviones, barcos o máquinas pesadas.', suma: ['mecanica_ind'] },
      { texto: 'Revisar y arreglar la parte eléctrica y los motores de los autos eléctricos e híbridos del futuro.', suma: ['mecanica_auto'] },
      { texto: 'Probar la calidad y seguridad en fábricas de alimentos, bebidas, cosméticos o plásticos.', suma: ['quimica'] },
      { texto: 'Programar y hacer andar máquinas automatizadas y brazos robóticos en una gran fábrica. ', suma: ['electromecanica'] }
    ]},
    { texto: '¿Cómo te gustaría que fuera tu día a día cuando seas un profesional?', opciones: [
      { texto: 'En una oficina cómoda con tu compu, creando sistemas, apps o protegiendo la información.', suma: ['info'] },
      { texto: 'Recorriendo obras al aire libre supervisando construcciones y dibujando proyectos en el estudio.', suma: ['construccion'] },
      { texto: 'En una fábrica enorme trabajando con motores grandes, tableros eléctricos y sistemas con fuerza de aire y aceite.', suma: ['electromecanica', 'mecanica_ind'] },
      { texto: 'En un laboratorio limpio con túnica, usando microscopios, tubos de ensayo y balanzas muy precisas.', suma: ['quimica'] }
    ]},
    { texto: 'Si te piden presentar un proyecto libre para la feria de ciencias, ¿qué preferís armar?', opciones: [
      { texto: 'Un autito o robot pequeño que camine o esquive cosas usando sensores.', suma: ['electronica', 'info'] },
      { texto: 'Una maqueta bien detallada de una casa ecológica que aproveche la luz del sol.', suma: ['construccion'] },
      { texto: 'Desarmar, limpiar y dejar impecable el motor de una moto o karting para que funcione genial.', suma: ['mecanica_auto'] },
      { texto: 'Fabricar tu propio jabón, gel antibacterial o un filtro casero para purificar agua.', suma: ['quimica'] }
    ]},
    { texto: '¿Qué tema te daría mucha curiosidad aprender en las clases del colegio?', opciones: [
      { texto: 'Cómo viaja la energía eléctrica desde las represas hasta los focos y enchufes de las casas.', suma: ['electricidad'] },
      { texto: 'Cómo funcionan las plaquitas de celulares, la memoria de las compus y los componentes miniatura.', suma: ['electronica'] },
      { texto: 'Cómo funciona el motor a explosión por dentro, la caja de cambios y la aceleración de un auto.', suma: ['mecanica_auto'] },
      { texto: 'Cómo usar tornos y máquinas de cortar metales para moldear piezas perfectas con tus manos.', suma: ['mecanica_ind'] }
    ]},
    { texto: '¿Qué pasatiempo de estos va más con tu forma de ser?', opciones: [
      { texto: 'Curiosear o desarmar aparatos viejos que no andan para ver qué tienen adentro.', suma: ['electronica', 'electricidad'] },
      { texto: 'Jugar juegos de estrategia, resolver rompecabezas difíciles o aprender a usar programas nuevos.', suma: ['info'] },
      { texto: 'Arreglar tu bici, la cerradura de una puerta o ayudar a usar herramientas de mano en casa.', suma: ['mecanica_ind', 'electromecanica'] },
      { texto: 'Mirar videos sobre carreras, modificaciones de autos, tuning o cómo se fabrican los vehículos.', suma: ['mecanica_auto'] }
    ]},
    { texto: 'Si tuvieras un "superpoder" personal, ¿cuál de estos sentís que tenés?', opciones: [
      { texto: '«Tengo mucha imaginación visual: me es fácil dibujar y calcular dimensiones de lugares.»', suma: ['construccion'] },
      { texto: '«Soy muy curioso, atento a los detalles y me encanta descubrir de qué están hechas las cosas.»', suma: ['quimica'] },
      { texto: '«Tengo mucha habilidad con las manos y me resulta fácil entender cómo se mueven las piezas mecánicas.»', suma: ['mecanica_ind'] },
      { texto: '«Tengo una mente muy lógica, soy paciente para encontrar fallas y resolver problemas paso a paso.»', suma: ['info'] }
    ]},
    { texto: 'Para ayudar a que el Paraguay progrese, ¿en qué área te gustaría trabajar cuando seas grande?', opciones: [
      { texto: 'En llevar luz y energía eléctrica segura y limpia a todas las ciudades del país.', suma: ['electricidad', 'electromecanica'] },
      { texto: 'En diseñar y construir mejores casas, puentes, rutas y edificios para todos.', suma: ['construccion'] },
      { texto: 'En las industrias que producen alimentos, remedios y cuidan el medio ambiente.', suma: ['quimica'] },
      { texto: 'En la tecnología, creando programas, aplicaciones y automatizando empresas paraguayas.', suma: ['info', 'electronica', 'electromecanica'] }
    ]}
  ];

  var AVISO = 'Esta guía no es un test psicológico ni vocacional profesional. Es una ayuda para conocer las especialidades del CTN según tus intereses.';
  var LETRAS = ['A', 'B', 'C', 'D'];

  var app = document.getElementById('app');
  var actual = 0;                                   // número de pregunta que se está mostrando
  var respuestas = new Array(PREGUNTAS.length);     // opción elegida en cada pregunta (0 a 3)
  var bloqueado = false;                            // evita doble clic mientras avanza


  /* ---------- Ayudas para crear elementos ---------- */

  function crear(etiqueta, clase, texto) {
    var el = document.createElement(etiqueta);
    if (clase) { el.className = clase; }
    if (texto !== undefined) { el.textContent = texto; }
    return el;
  }

  function boton(texto, clase, alHacerClic) {
    var b = crear('button', 'boton ' + (clase || ''), texto);
    b.type = 'button';
    b.addEventListener('click', alHacerClic);
    return b;
  }

  /** Reemplaza el contenido y lleva el foco al título para lectores de pantalla y teclado. */
  function mostrar(nodos, foco) {
    app.textContent = '';
    nodos.forEach(function (n) { app.appendChild(n); });
    (foco || app).focus();
  }


  /* ---------- Pantalla 1: inicio ---------- */

  /* Íconos de los dos datos (dibujos SVG propios, sin archivos externos) */
  var ICONO_PREGUNTAS = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3.5" width="14" height="17.5" rx="2"/><path d="M9 3.5h6v2.5H9z"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4"/></svg>';
  var ICONO_RELOJ = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9.5 2.5h5"/></svg>';

  var ICONO_AVISO = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/></svg>';

  function pantallaInicio() {
    var cont = crear('div', 'inicio');

    var cabecera = crear('div', 'inicio-cabecera');
    var texto = crear('div', 'inicio-texto');
    var titulo = crear('h2', '', 'Descubrí qué especialidad se parece más a vos');
    titulo.tabIndex = -1;
    texto.appendChild(titulo);
    texto.appendChild(crear('p', '', 'Elegí siempre la opción que más se parezca a vos: no hay respuestas buenas ni malas.'));
    var logo = crear('img', 'inicio-logo');
    logo.src = '../../assets/images/logo.png';
    logo.alt = 'Logo del Colegio Técnico Nacional';
    logo.width = 166; logo.height = 226;
    cabecera.appendChild(texto);
    cabecera.appendChild(logo);
    cont.appendChild(cabecera);

    var datos = crear('div', 'datos');
    [[ICONO_PREGUNTAS, String(PREGUNTAS.length), 'preguntas'], [ICONO_RELOJ, '3', 'minutos']].forEach(function (d) {
      var caja = crear('div', 'dato');
      caja.insertAdjacentHTML('beforeend', d[0]);
      var t = crear('div', 'dato-texto');
      t.appendChild(crear('strong', '', d[1]));
      t.appendChild(crear('span', '', d[2]));
      caja.appendChild(t);
      datos.appendChild(caja);
    });
    cont.appendChild(datos);

    var aviso = crear('div', 'aviso');
    aviso.insertAdjacentHTML('beforeend', ICONO_AVISO);
    aviso.appendChild(crear('p', '', AVISO));
    cont.appendChild(aviso);

    var acciones = crear('div', 'acciones');
    acciones.appendChild(boton('Comenzar', '', function () { actual = 0; pantallaPregunta(); }));
    cont.appendChild(acciones);
    mostrar([cont], titulo);
  }


  /* ---------- Pantalla 2: pregunta ---------- */

  function pantallaPregunta() {
    bloqueado = false;
    var p = PREGUNTAS[actual];

    var progreso = crear('div', 'progreso');
    var barra = crear('div', 'progreso-barra');
    barra.setAttribute('role', 'progressbar');
    barra.setAttribute('aria-label', 'Progreso de la guía');
    barra.setAttribute('aria-valuemin', '1');
    barra.setAttribute('aria-valuemax', String(PREGUNTAS.length));
    barra.setAttribute('aria-valuenow', String(actual + 1));
    var relleno = document.createElement('i');
    relleno.style.width = ((actual + 1) / PREGUNTAS.length * 100) + '%';
    barra.appendChild(relleno);
    progreso.appendChild(barra);
    progreso.appendChild(crear('span', 'progreso-texto', 'Pregunta ' + (actual + 1) + ' de ' + PREGUNTAS.length));

    var titulo = crear('h2', '', p.texto);
    titulo.tabIndex = -1;

    var opciones = crear('div', 'opciones');
    opciones.setAttribute('role', 'group');
    p.opciones.forEach(function (op, i) {
      var b = crear('button', 'opcion');
      b.type = 'button';
      b.setAttribute('aria-pressed', respuestas[actual] === i ? 'true' : 'false');
      b.appendChild(crear('span', 'letra', LETRAS[i]));
      b.appendChild(crear('span', '', op.texto));
      b.addEventListener('click', function () { elegir(i, b); });
      opciones.appendChild(b);
    });

    var acciones = crear('div', 'acciones');
    var atras = boton('Atrás', 'boton-claro', function () { if (!bloqueado) { actual--; pantallaPregunta(); } });
    if (actual === 0) { atras.disabled = true; }
    acciones.appendChild(atras);

    mostrar([progreso, titulo, opciones, acciones], titulo);
  }

  function elegir(indice, botonElegido) {
    if (bloqueado) { return; }
    bloqueado = true;
    respuestas[actual] = indice;
    botonElegido.setAttribute('aria-pressed', 'true');
    setTimeout(function () {                        // pausa corta para que se vea la elección
      if (actual < PREGUNTAS.length - 1) { actual++; pantallaPregunta(); } else { pantallaResultados(); }
    }, 250);
  }


  /* ---------- Cálculo del resultado ---------- */

  function calcularPuntajes() {
    var puntos = {};
    Object.keys(ESPECIALIDADES).forEach(function (id) { puntos[id] = 0; });
    respuestas.forEach(function (eleccion, i) {
      PREGUNTAS[i].opciones[eleccion].suma.forEach(function (id) { puntos[id]++; });
    });
    return puntos;
  }

  /** Las 2 especialidades con más puntos; si hay empate por el segundo puesto, hasta 3. */
  function mejores(puntos) {
    var orden = Object.keys(puntos).sort(function (a, b) { return puntos[b] - puntos[a]; });
    var corte = puntos[orden[1]];
    return orden.filter(function (id, i) { return i < 2 || (i < 3 && puntos[id] === corte); });
  }


  /* ---------- Pantalla 3: resultados ---------- */

  function pantallaResultados() {
    var elegidas = mejores(calcularPuntajes());

    var titulo = crear('h2', '', elegidas.length === 1 ? 'Tu especialidad más afín' : 'Tus especialidades más afines');
    titulo.tabIndex = -1;

    var lista = crear('div', 'resultados');
    elegidas.forEach(function (id, i) {
      var esp = ESPECIALIDADES[id];
      var tarjeta = crear('article', 'resultado');
      tarjeta.style.animationDelay = (i * 0.15) + 's';
      var img = crear('img');
      img.src = './Img/' + esp.logo;
      img.alt = '';
      img.width = 96; img.height = 96;
      tarjeta.appendChild(img);
      var info = crear('div');
      info.appendChild(crear('p', 'puesto', i === 0 ? 'La que más coincide' : 'También te puede gustar'));
      info.appendChild(crear('h3', '', esp.nombre));
      info.appendChild(crear('p', '', esp.texto));
      var enlace = crear('a', 'boton', 'Conocer esta especialidad');
      enlace.href = '../../espe.html#' + id;
      info.appendChild(enlace);
      tarjeta.appendChild(info);
      lista.appendChild(tarjeta);
    });

    var aviso = crear('p', 'aviso', AVISO + ' Visitá el colegio, hablá con los coordinadores y conocé los talleres antes de decidir.');

    var acciones = crear('div', 'acciones');
    acciones.appendChild(boton('Volver a intentar', 'boton-claro', function () { respuestas = new Array(PREGUNTAS.length); pantallaInicio(); }));
    var todas = crear('a', 'boton', 'Ver todas las especialidades');
    todas.href = '../../espe.html';
    acciones.appendChild(todas);

    mostrar([titulo, lista, aviso, acciones], titulo);
  }

  pantallaInicio();
})();
</script>
</body>
</html>
