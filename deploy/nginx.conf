# CTN · Configuración de Nginx para el sitio (reemplaza /etc/nginx/nginx.conf)
# El sitio se sirve solo en el equipo (127.0.0.1:8080); Tailscale Funnel lo publica.
worker_processes 1;
events { worker_connections 256; }

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  server {
    listen 127.0.0.1:8080;
    root /srv/ctn/actual;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    location / { try_files $uri $uri/ =404; }
    location = /404.html { internal; }

    # HTML, CSS y JS: se revalidan siempre (barato: si no cambió, responde 304).
    # Así lo que se publica se ve de inmediato.
    # (Nginx no hereda los add_header del servidor dentro de un location que define los suyos; por eso se repiten.)
    location ~* \.(?:html|css|js)$ {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Imágenes y tipografías: el navegador las guarda una semana.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
      expires 7d;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Nada de archivos ocultos (.git, .env...)
    location ~ /\.(?!well-known) { deny all; }
  }
}
